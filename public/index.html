<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Maktab platformasi</title>
<style>
:root{--bg:#eef2fb;--c:#fff;--t:#17203a;--m:#6a7694;--p:#0265fe;--p2:#0a3fc4;--b:#e3e8f4;--r:#e5484d;--ok:#12a579;--w:#f59e0b;--sh:0 1px 2px rgba(23,32,58,.06),0 8px 24px rgba(40,60,130,.08)}
@media(prefers-color-scheme:dark){:root{--bg:#0d1220;--c:#151c30;--t:#e8ecf8;--m:#8e9bbb;--p:#4d93ff;--p2:#2a6df0;--b:#26304c;--sh:0 8px 28px rgba(0,0,0,.35)}}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font:15px/1.5 Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--t);background:radial-gradient(900px 400px at 10% -10%,rgba(2,101,254,.12),transparent),radial-gradient(800px 400px at 100% 0,rgba(2,101,254,.14),transparent),var(--bg);min-height:100vh}
nav{position:sticky;top:0;z-index:5;display:flex;gap:6px;align-items:center;padding:10px 16px;background:linear-gradient(120deg,var(--p),var(--p2));box-shadow:0 6px 24px rgba(2,101,254,.35);overflow-x:auto;white-space:nowrap}
nav b{color:#fff;font-size:17px;letter-spacing:.2px;margin-right:14px}
nav a,nav button{color:#fff;background:none;border:0;padding:8px 14px;border-radius:999px;cursor:pointer;font:inherit;text-decoration:none;transition:background .2s,transform .2s}
nav a:hover,nav button:hover{background:rgba(255,255,255,.18);transform:translateY(-1px)}nav a.on{background:rgba(255,255,255,.28);font-weight:600}
#bar{position:fixed;top:0;left:0;height:3px;width:0;background:#fff;z-index:9;opacity:0;transition:width .6s,opacity .3s}#bar.on{width:80%;opacity:1}
main{max-width:1120px;margin:22px auto;padding:0 14px}main.in>*{animation:up .45s cubic-bezier(.2,.7,.2,1) both}main.in>*:nth-child(2){animation-delay:.07s}main.in>*:nth-child(3){animation-delay:.14s}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}@keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
.card{background:var(--c);border:1px solid var(--b);border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:var(--sh);overflow-x:auto;transition:transform .25s,box-shadow .25s}
h3{margin:0 0 12px;font-size:18px}h4{margin:18px 0 8px}
table{border-collapse:separate;border-spacing:0;width:100%}th{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--m);background:rgba(120,140,200,.08)}
th:first-child{border-radius:10px 0 0 10px}th:last-child{border-radius:0 10px 10px 0}
th,td{padding:10px 12px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--b)}tbody tr,tr{transition:background .15s}tr:hover td{background:rgba(120,140,200,.07)}
input,select,textarea{font:inherit;padding:9px 12px;border:1.5px solid var(--b);border-radius:10px;background:var(--c);color:var(--t);max-width:100%;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--p);box-shadow:0 0 0 4px rgba(2,101,254,.16)}
.b{font:inherit;font-weight:600;padding:9px 18px;background:linear-gradient(120deg,var(--p),var(--p2));color:#fff;border:0;border-radius:10px;cursor:pointer;box-shadow:0 6px 16px rgba(2,101,254,.3);transition:transform .15s,box-shadow .2s}
.b:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(2,101,254,.4)}.b:active{transform:scale(.97)}
a{color:var(--p);font-weight:500}.row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;align-items:center}.m{color:var(--m)}
#msg{position:fixed;bottom:18px;right:18px;padding:12px 18px;border-radius:12px;color:#fff;display:none;z-index:9;box-shadow:var(--sh);animation:pop .25s}
.gi{width:70px;text-align:center;font-weight:600}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:16px}
.st{background:var(--c);border:1px solid var(--b);border-radius:16px;padding:18px;box-shadow:var(--sh);position:relative;overflow:hidden;animation:pop .5s both;transition:transform .25s}.st:hover{transform:translateY(-4px)}
.st:before{content:"";position:absolute;right:-20px;top:-20px;width:80px;height:80px;border-radius:50%;background:linear-gradient(120deg,var(--p),var(--p2));opacity:.15}
.st small{color:var(--m)}.st div{font-size:34px;font-weight:700;background:linear-gradient(120deg,var(--p),var(--p2));-webkit-background-clip:text;background-clip:text;color:transparent}
.bd{padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;background:rgba(18,165,121,.15);color:var(--ok)}.bd.arxiv{background:rgba(245,158,11,.18);color:var(--w)}
.login{max-width:380px;margin:9vh auto;text-align:center;padding:34px 28px;animation:pop .5s both}.login .row{flex-direction:column}.login input{width:100%}
.logo{width:68px;height:68px;margin:0 auto 12px;border-radius:20px;display:grid;place-items:center;font-size:34px;background:linear-gradient(120deg,var(--p),var(--p2));box-shadow:0 10px 26px rgba(2,101,254,.4);animation:fl 3s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-6px)}}.login h2{margin:0}
@media(max-width:640px){main{margin-top:14px}.card{padding:14px;border-radius:14px}nav b{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{nav,.row,#msg,#bar{display:none}.card{border:0;box-shadow:none}body{background:#fff}}
dialog{border:0;border-radius:18px;padding:0;width:min(780px,96vw);max-height:92vh;background:var(--c);color:var(--t);box-shadow:0 30px 80px rgba(0,0,0,.35)}dialog::backdrop{background:rgba(8,20,50,.55);backdrop-filter:blur(3px)}dialog[open]{animation:pop .25s both}
.dh{display:flex;align-items:center;justify-content:space-between;padding:16px 22px;background:linear-gradient(120deg,var(--p),var(--p2));color:#fff}.dh h3{margin:0}.dh .x{background:none;border:0;color:#fff;font-size:20px;cursor:pointer}
.db{padding:18px 22px;overflow:auto;max-height:calc(92vh - 140px)}.df{padding:14px 22px;border-top:1px solid var(--b);display:flex;gap:10px;justify-content:flex-end}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.fg label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--m)}.fg input,.fg select,.fg textarea{font-size:15px;width:100%}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}.chip{cursor:pointer}.chip input{display:none}.chip span{display:inline-block;padding:6px 14px;border-radius:999px;border:1.5px solid var(--b);transition:.15s}.chip input:checked+span{background:var(--p);border-color:var(--p);color:#fff}
.chip2{display:inline-block;margin:4px 4px 0 0;padding:2px 10px;border-radius:999px;background:rgba(2,101,254,.12);color:var(--p);font-size:12px;font-weight:600}
.tg{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}.tc{display:flex;gap:14px;padding:16px;border:1px solid var(--b);border-radius:16px;background:var(--c);cursor:pointer;position:relative;transition:transform .2s,box-shadow .2s}.tc:hover{transform:translateY(-3px);box-shadow:var(--sh)}.tc.off{opacity:.55}
.av{flex:none;width:64px;height:64px;border-radius:50%;overflow:hidden;display:grid;place-items:center;font-weight:700;font-size:20px;color:#fff;background:linear-gradient(120deg,var(--p),var(--p2))}.av img{width:100%;height:100%;object-fit:cover}
.ph{display:flex;gap:16px;align-items:center;margin-bottom:6px}.ph .av{width:88px;height:88px;font-size:34px}.g{background:none;border:0;color:var(--r);cursor:pointer;font:inherit}
.lg{height:36px;margin-right:8px}.cred{padding:18px;border-radius:12px;background:rgba(18,165,121,.1);font-size:17px;line-height:1.8}nav:empty{display:none}
.lh{margin:-34px -28px 22px;padding:30px 20px;background:linear-gradient(120deg,var(--p),var(--p2));border-radius:16px 16px 0 0}.lh img{width:230px;max-width:80%}
.lp{background:linear-gradient(120deg,var(--p),var(--p2));padding:10px 16px;border-radius:10px;display:inline-block}.lp img{height:44px;display:block}
</style></head><body>
<div id=bar></div><nav id=nav></nav><main id=main></main><div id=msg></div><dialog id=dlg></dialog>
<script>
const $=s=>document.querySelector(s),M=$('#main');let U,D={},NAME='Maktab',LOGO='/logo.png',BR='',NL;
const e=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const api=async(m,p,b)=>{const r=await fetch('/api'+p,{method:m,headers:{'content-type':'application/json'},body:b?JSON.stringify(b):undefined});const j=await r.json().catch(()=>null);if(j===null)throw new Error('API javob bermayapti (HTTP '+r.status+'). Netlify Functions joylanmagan yoki xato.');if(!r.ok)throw new Error(j.error||('HTTP '+r.status+': '+(j.errorMessage||JSON.stringify(j)).slice(0,300)));return j};
const msg=(t,er)=>{const m=$('#msg');m.textContent=t;m.style.background=er?'var(--r)':'var(--p)';m.style.display='block';clearTimeout(msg.t);msg.t=setTimeout(()=>m.style.display='none',2800)};
const go=async f=>{const B=$('#bar');try{B.classList.add('on');M.style.opacity=.6;await f();}catch(x){msg(x.message,1)}finally{M.style.opacity=1;B.classList.remove('on')}};
const DAYS=['','Dushanba','Seshanba','Chorshanba','Payshanba','Juma','Shanba','Yakshanba'];
const today=new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Tashkent'});
const wd=(d=>d||7)(new Date(today+'T12:00:00').getDay());
const opt=(a,k='name',sel)=>a.map(x=>`<option value=${x.id} ${x.id==sel?'selected':''}>${e(x[k])}</option>`).join('');
const csv=(rows,n)=>{const t='\ufeff'+rows.map(r=>r.map(c=>'"'+String(c??'').replace(/"/g,'""')+'"').join(';')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));a.download=n+'.csv';a.click()};
const TABS=[['dash','🏠 Bosh sahifa'],['journal','📒 Jurnal'],['tt','🗓 Dars jadvali'],['cls','🏫 Sinflar'],['rep','📊 Hisobotlar'],['users','👥 Xodimlar','admin,director']];
async function boot(){try{const p=await api('GET','/public');NAME=p.school_name;LOGO=p.logo||'/logo.png';BR=p.brand||'';brandIt(BR);document.title=NAME}catch(x){$('#nav').innerHTML='<b>Maktab platformasi</b>';M.innerHTML='<div class="card login"><div class=logo>⚠️</div><h3>Server bilan aloqa yo\'q</h3><p>'+e(x.message)+'</p><p class=m>Tekshiring: <code>/api/public</code> manzilini brauzerda oching. Netlify → Functions bo\'limida «api» funksiyasi va Environment variables (TURSO_DATABASE_URL, TURSO_AUTH_TOKEN, SESSION_SECRET, ADMIN_PASSWORD) bo\'lishi kerak.</p></div>';return}
 try{U=await api('GET','/me');await load();}catch{login()}}
async function load(){[D.classes,D.subjects,D.asg]=await Promise.all([api('GET','/classes'),api('GET','/subjects'),api('GET','/assignments')]);
 if(U.role!='teacher'){D.users=await api('GET','/users')}nav('dash')}
const brandHtml=()=>`<img class=lg src="${e(LOGO)}" alt=""><b>${e(NAME)}</b>`;
function brandIt(c){if(!/^#[0-9a-f]{6}$/i.test(c||''))return;const r=document.documentElement.style;r.setProperty('--p',c);r.setProperty('--p2','#'+[1,3,5].map(i=>Math.round(parseInt(c.substr(i,2),16)*.72).toString(16).padStart(2,'0')).join(''))}
function nav(v){$('#nav').innerHTML=brandHtml()+TABS.filter(t=>!t[2]||t[2].includes(U.role)).map(t=>`<a href=# class="${t[0]==v?'on':''}" onclick="nav('${t[0]}');return false">${t[1]}</a>`).join('')+`<span style="flex:1"></span><span style="color:#fff">${e(U.name)}</span><button onclick="out()">Chiqish</button>`;M.classList.remove('in');void M.offsetWidth;M.classList.add('in');go(V[v])}
async function out(){await api('POST','/logout');location.reload()}
function login(){$('#nav').innerHTML='';M.innerHTML=`<div class="card login"><div class=lh><img src="${e(LOGO)}" alt=""></div><h2>${e(NAME)}</h2><p class=m>Maktab boshqaruv platformasi</p><div class=row><input id=l placeholder=Login autocomplete=username style="width:100%"><input id=p type=password placeholder=Parol autocomplete=current-password style="width:100%" onkeydown="event.key=='Enter'&&doLogin()"></div><button class=b style="width:100%" onclick="doLogin()">Kirish</button></div>`}
const doLogin=()=>go(async()=>{U=await api('POST','/login',{login:$('#l').value,password:$('#p').value});await load()});
const V={
async dash(){const t=await api('GET','/timetable?weekday='+wd+(U.role=='teacher'?'&teacher_id='+U.id:''));
 M.innerHTML=`<div class=card><h3>Bugungi darslar — ${DAYS[wd]}, ${today}</h3>${t.length?`<table><tr><th>Vaqt<th>Sinf<th>Fan<th>Xona<th>O'qituvchi</tr>${t.map(x=>`<tr><td>${x.start}–${x.end}<td>${e(x.class)}<td>${e(x.subject)}<td>${e(x.room)}<td>${e(x.teacher)}`).join('')}</table>`:'<p class=m>Bugun dars yo\'q.</p>'}</div>
 `;M.insertAdjacentHTML('afterbegin',`<div class=stats><div class=st><small>Bugungi darslar</small><div>${t.length}</div></div><div class=st style=animation-delay:.08s><small>Sinflar</small><div>${D.classes.length}</div></div><div class=st style=animation-delay:.16s><small>Fanlar</small><div>${D.subjects.length}</div></div><div class=st style=animation-delay:.24s><small>Biriktirilgan fanlar</small><div>${D.asg.length}</div></div></div>`)},
async journal(){M.innerHTML=`<div class=card><div class=row><select id=jc>${opt(D.classes)}</select><select id=js>${opt(D.subjects)}</select><input type=date id=jd value=${today}><select id=jt><option>joriy<option>nazorat<option>uy vazifasi</select><label>maks <input id=jm type=number min=1 value=5 style="width:64px"></label><button class=b onclick="go(loadJ)">Ochish</button></div><div id=jb class=m>Sinf va fanni tanlab «Ochish» ni bosing.</div></div>`},
async tt(){const list=await api('GET','/timetable'+(U.role=='teacher'?'?teacher_id='+U.id:''));const adm=U.role=='admin',tch=(D.users||[]).filter(x=>x.role=='teacher');
 M.innerHTML=`${adm?`<div class=card><h3>Dars qo'shish</h3><div class=row><select id=tc>${opt(D.classes)}</select><select id=ts>${opt(D.subjects)}</select><select id=tu>${opt(tch)}</select><select id=tw>${DAYS.slice(1).map((d,i)=>`<option value=${i+1}>${d}`).join('')}</select><input id=t1 type=time value=08:00><input id=t2 type=time value=08:45><input id=tr placeholder=Xona style="width:80px"><button class=b onclick="go(addTT)">Qo'shish</button></div></div>`:''}
 <div class=card><div class=row><h3 style="margin:0;flex:1">Haftalik jadval</h3><button class=b onclick=print()>Chop etish / PDF</button></div><table><tr><th>Kun<th>Vaqt<th>Sinf<th>Fan<th>Xona<th>O'qituvchi${adm?'<th>':''}</tr>${list.map(x=>`<tr><td>${DAYS[x.weekday]}<td>${x.start}–${x.end}<td>${e(x.class)}<td>${e(x.subject)}<td>${e(x.room)}<td>${e(x.teacher)}${adm?`<td><a href=# onclick="go(()=>delTT(${x.id}));return false">o'chirish</a>`:''}`).join('')}</table></div>`},
async cls(){const adm=U.role=='admin';M.innerHTML=`${adm?`<div class=card><h3>Sozlash</h3><div class=row><input id=cn placeholder="Sinf (7-A)" style="width:100px"><input id=cy placeholder="2026-2027" style="width:110px"><select id=ch><option value="">Sinf rahbari</option>${opt(D.users.filter(x=>x.role=='teacher'))}</select><button class=b onclick="go(addCls)">Sinf qo'shish</button></div>
 <div class=row><input id=sn placeholder="Yangi fan"><button class=b onclick="go(addSub)">Fan qo'shish</button></div>
 <div class=row><select id=ac>${opt(D.classes)}</select><select id=as>${opt(D.subjects)}</select><select id=at>${opt(D.users.filter(x=>x.role=='teacher'))}</select><button class=b onclick="go(addAsg)">Fan o'qituvchisini biriktirish</button></div></div>`:''}
 <div class=card><div class=row><select id=sc onchange="go(loadSt)">${opt(D.classes)}</select></div><div id=sb></div></div>`;if(D.classes.length)go(loadSt)},
async rep(){M.innerHTML=`<div class=card><div class=row><select id=rc>${opt(D.classes)}</select><button class=b onclick="go(loadRep)">Hisobot</button></div><div id=rb></div></div>`},
async users(){D.users=await api('GET','/users');const adm=U.role=='admin';
 M.innerHTML=`<div class=card><div class=row><h3 style="margin:0;flex:1">Xodimlar (${D.users.length})</h3><input id=q placeholder="Qidirish: ism, login, telefon" oninput=drawT() style="min-width:220px"><select id=qs onchange=drawT()><option value="">Barcha fanlar${opt(D.subjects)}</select><select id=qr onchange=drawT()><option value="">Barcha rollar<option value=teacher>O'qituvchi<option value=director>Direktor<option value=admin>Administrator</select>${adm?`<button class=b onclick="openT()">＋ Yangi xodim</button>`:''}</div><div id=tg class=tg></div></div>
 ${adm?`<div class=card><h3>Maktab sozlamalari</h3><div class=row><input id=sch value="${e(NAME)}" style="min-width:240px"><label>Asosiy rang <input type=color id=sbc value="${BR||'#0265fe'}" style="padding:2px;height:40px;width:56px"></label></div>
 <div class=row><div class=lp><img id=lp src="${e(LOGO)}"></div><label class=b>Logo tanlash<input type=file accept="image/*" hidden onchange="go(()=>pickLogo(this))"></label><button type=button class=g style="color:var(--m)" onclick="NL='';lp.src='/logo.png'">Standart logo</button></div>
 <div class=row><button class=b onclick="go(saveSet)">Saqlash</button><button class=b onclick="go(backup)" style="background:var(--m);box-shadow:none">Zaxira nusxa (JSON)</button></div></div>`:''}`;drawT()}};
const re=f=>async()=>{await f();msg('Saqlandi')};
const addTT=re(async()=>{await api('POST','/timetable',{class_id:+tc.value,subject_id:+ts.value,teacher_id:+tu.value,weekday:+tw.value,start:t1.value,end:t2.value,room:tr.value});V.tt()});
window.delTT=async id=>{await api('DELETE','/timetable/'+id);msg('O\'chirildi');V.tt()};
const addCls=re(async()=>{await api('POST','/classes',{name:cn.value,year:cy.value,homeroom_id:+ch.value||null});await load()});
const addSub=re(async()=>{await api('POST','/subjects',{name:sn.value});await load()});
const addAsg=re(async()=>{await api('POST','/assignments',{class_id:+ac.value,subject_id:+as.value,teacher_id:+at.value});D.asg=await api('GET','/assignments')});
const addUser=re(async()=>{await api('POST','/users',{name:un.value,login:ul.value,password:up.value,role:ur.value});D.users=await api('GET','/users');V.users()});
const togUser=async(id,v)=>{await api('PATCH','/users/'+id,{is_active:v});V.users()};
const saveName=re(async()=>{await api('PUT','/settings',{school_name:sch.value});NAME=sch.value;nav('users')});
const backup=async()=>{const j=await api('GET','/backup');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(j)],{type:'application/json'}));a.download='zaxira-'+today+'.json';a.click()};
let J;
async function loadJ(){J={c:+jc.value,s:+js.value};const j=await api('GET',`/journal?class_id=${J.c}&subject_id=${J.s}`);J.d=j;const ed=j.can_edit;
 const g=(sid,d,t)=>j.grades.find(x=>x.student_id==sid&&x.date==d&&x.type==t),a=(sid,d)=>j.attendance.find(x=>x.student_id==sid&&x.date==d);
 const avg=sid=>{const v=j.grades.filter(x=>x.student_id==sid);return v.length?(v.reduce((s,x)=>s+x.value*100/x.max,0)/v.length).toFixed(0)+'%':'—'};
 const l=j.lessons.find(x=>x.date==jd.value)||{};
 jb.innerHTML=`<table><tr><th>№<th>O'quvchi<th>Baho (${e(jt.value)})<th>Davomat<th>Izoh<th>O'rtacha</tr>${j.students.map((s,i)=>{const x=g(s.id,jd.value,jt.value),at=a(s.id,jd.value);return`<tr data-s=${s.id}><td>${i+1}<td>${e(s.name)}<td><input class=gi type=number step=any inputmode=decimal ${ed?'':'disabled'} value="${x?x.value:''}" onkeydown="if(event.key=='Enter'){event.preventDefault();nx(this)}" onchange="go(()=>sg(this))"><td><select ${ed?'':'disabled'} onchange="go(()=>sa(this))"><option value="">—${['keldi','kelmadi','kechikdi','uzrli'].map(k=>`<option ${at&&at.status==k?'selected':''}>${k}`).join('')}</select><td><input value="${e(x?x.comment:'')}" ${ed?'':'disabled'} onchange="go(()=>sg(this))" style="width:140px"><td>${avg(s.id)}`}).join('')}</table>
 ${ed?`<h4>Dars mavzusi va uy vazifasi (${jd.value})</h4><div class=row><input id=lt placeholder=Mavzu value="${e(l.topic)}" style="flex:1;min-width:200px"><input id=lh placeholder="Uy vazifasi" value="${e(l.homework)}" style="flex:1;min-width:200px"><button class=b onclick="go(sl)">Saqlash</button></div>`:'<p class=m>Faqat ko\'rish rejimi.</p>'}
 <h4>Oxirgi darslar</h4>${j.lessons.map(x=>`<div class=m>${x.date}: ${e(x.topic)} — <i>${e(x.homework)}</i></div>`).join('')||'<p class=m>Hali yo\'q</p>'}`}
const nx=i=>{const n=i.closest('tr').nextElementSibling;n&&n.querySelector('.gi').focus()};

 sb.innerHTML=`<p class=m>Sinf rahbari: ${e(cl.homeroom||'—')}. Fanlar: ${D.asg.filter(x=>x.class_id==c).map(x=>e(x.subject+' ('+x.teacher+')')).join(', ')||'—'}</p><table><tr><th>№<th>F.I.Sh.<th>Kod<th>Holat<th></tr>${st.map((s,i)=>`<tr><td>${i+1}<td>${e(s.name)}<td>${e(s.code)}<td><span class="bd ${s.status}">${s.status}</span><td>${can?`<a href=# onclick="go(()=>arch(${s.id},'${s.status=='faol'?'arxiv':'faol'}'));return false">${s.status=='faol'?'arxivlash':'tiklash'}</a>`:''}`).join('')}</table>
 ${can?`<h4>O'quvchilar qo'shish (har qatorda: F.I.Sh.;kod)</h4><textarea id=imp rows=4 style="width:100%"></textarea><br><br><button class=b onclick="go(imp2)">Qo'shish</button>`:''}`}

async function loadRep(){const r=await api('GET','/reports/class?class_id='+rc.value);const subs=[...new Set(r.grades.map(x=>x.subject))];
 const rows=r.students.map(s=>{const av=subs.map(u=>{const g=r.grades.find(x=>x.student_id==s.id&&x.subject==u);return g?g.pct+'%':'—'});const at=k=>(r.attendance.find(x=>x.student_id==s.id&&x.status==k)||{n:0}).n;return[s.name,...av,at('kelmadi'),at('kechikdi'),at('uzrli')]});
 const head=['F.I.Sh.',...subs,'Kelmadi','Kechikdi','Uzrli'];window.RP=[head,...rows];
 rb.innerHTML=`<div class=row><button class=b onclick="csv(RP,'hisobot')">Excel (CSV)</button><button class=b onclick=print()>Chop etish / PDF</button></div><table><tr>${head.map(h=>'<th>'+e(h)).join('')}</tr>${rows.map(r=>'<tr>'+r.map(c=>'<td>'+e(c)).join('')+'</tr>').join('')}</table><p class=m>Foizlar — baholangan ishlar o'rtachasi (baholanmagan ish hisobga olinmaydi).</p>`}

const ROLE={teacher:"O'qituvchi",director:'Direktor',admin:'Administrator'};
const ini=u=>((u.first_name||u.name||'?').charAt(0)+(u.last_name||'').charAt(0)).toUpperCase();
const F=(id,l,v,t='text',x='')=>`<label>${l}<input id=${id} type=${t} value="${e(v)}" ${x}></label>`;
const pickImg=(f,sq)=>new Promise((ok,no)=>{const i=new Image();i.onload=()=>{const c=document.createElement('canvas'),x=c.getContext('2d');if(sq){c.width=c.height=256;const m=Math.min(i.width,i.height);x.drawImage(i,(i.width-m)/2,(i.height-m)/2,m,m,0,0,256,256);ok(c.toDataURL('image/jpeg',.82))}else{const w=Math.min(480,i.width);c.width=w;c.height=Math.round(i.height*w/i.width);x.drawImage(i,0,0,c.width,c.height);ok(c.toDataURL('image/png'))}};i.onerror=()=>no(new Error("Rasm o'qilmadi"));i.src=URL.createObjectURL(f)});
const pickLogo=async el=>{NL=await pickImg(el.files[0],false);lp.src=NL};
const saveSet=async()=>{const b={school_name:sch.value,brand:sbc.value};if(NL!==undefined)b.logo=NL;await api('PUT','/settings',b);NAME=sch.value;BR=sbc.value;brandIt(BR);if(NL!==undefined)LOGO=NL||'/logo.png';NL=undefined;msg('Saqlandi');nav('users')};
function drawT(){const t=(q.value||'').toLowerCase(),s=qs.value,r=qr.value,adm=U.role=='admin';
 const L=D.users.filter(u=>(!r||u.role==r)&&(!s||u.subjects.some(x=>x.id==s))&&(!t||[u.name,u.login,u.phone].join(' ').toLowerCase().includes(t)));
 tg.innerHTML=L.map(u=>`<div class="tc ${u.is_active?'':'off'}" ${adm?`onclick="openT(${u.id})"`:''}><div class=av>${u.photo?`<img src="${e(u.photo)}" alt="">`:e(ini(u))}</div><div><b>${e(u.name)}</b><div class=m>${ROLE[u.role]} · @${e(u.login)}</div><div>${u.subjects.map(x=>`<span class=chip2>${e(x.name)}</span>`).join('')}</div><div class=m>${u.experience_years!=null?u.experience_years+' yil staj':''}${u.category?' · '+e(u.category):''}${u.phone?'<br>📞 '+e(u.phone):''}</div></div>${u.is_active?'':'<span class="bd arxiv" style="position:absolute;top:10px;right:10px">faolsiz</span>'}</div>`).join('')||'<p class=m>Xodim topilmadi.</p>'}
const chips=ids=>D.subjects.map(s=>`<label class=chip><input type=checkbox value=${s.id} ${ids.includes(s.id)?'checked':''}><span>${e(s.name)}</span></label>`).join('');
let EDIT=null,PH=null;
function openT(id){const u=D.users.find(x=>x.id==id)||{subjects:[]};EDIT=id?u:null;PH=u.photo||null;const ids=u.subjects.map(x=>x.id);
 const O=(v,a)=>a.map(x=>`<option ${v==x?'selected':''}>${x}</option>`).join('');
 dlg.innerHTML=`<div class=dh><h3>${id?'Xodimni tahrirlash':'Yangi xodim'}</h3><button type=button class=x onclick="dlg.close()">✕</button></div><div class=db>
 <div class=ph><div class=av id=pv>${PH?`<img src="${e(PH)}">`:'👤'}</div><div><label class=b style="display:inline-block">Rasm tanlash<input type=file accept="image/*" hidden onchange="go(()=>phSet(this))"></label> <button type=button class=g onclick="PH=null;pv.textContent='👤'">Olib tashlash</button><div class=m>Rasm avtomatik 256×256 ga moslanadi</div></div></div>
 <h4>Shaxsiy ma'lumotlar</h4><div class=fg>${F('f_last','Familiya *',u.last_name||'','text','oninput=sug()')}${F('f_first','Ism *',u.first_name||(u.last_name?'':u.name)||'','text','oninput=sug()')}${F('f_mid','Otasining ismi',u.middle_name||'')}${F('f_birth',"Tug'ilgan sana",u.birth_date||'','date')}<label>Jins<select id=f_gender><option value="">—${O(u.gender,['erkak','ayol'])}</select></label></div>
 <h4>Kasbiy ma'lumotlar</h4><div class=m style="margin-bottom:6px">Dars beradigan fanlar</div><div class=chips id=f_sub>${chips(ids)}</div><div class=row><input id=ns placeholder="Ro'yxatda yo'q fan nomi"><button type=button class=b onclick="go(addSubIn)">＋ Fan qo'shish</button></div>
 <div class=fg>${F('f_exp','Ish staji (yil)',u.experience_years??'','number','min=0 max=60')}<label>Malaka toifasi<select id=f_cat><option value="">—${O(u.category,['Oliy toifa','1-toifa','2-toifa','Mutaxassis','Toifasiz'])}</select></label>${F('f_edu',"Ma'lumoti",u.education||'','text','list=edl')}<datalist id=edl><option>Oliy<option>Magistr<option>O'rta maxsus</datalist>${F('f_hire','Ishga kirgan sana',u.hire_date||'','date')}</div>
 <label class=fg style="display:block;margin-top:12px"><span class=m style="font-size:13px">Qisqa ma'lumot</span><textarea id=f_bio rows=2>${e(u.bio)}</textarea></label>
 <h4>Aloqa</h4><div class=fg>${F('f_phone','Telefon',u.phone||'','tel','placeholder="+998 90 123 45 67"')}${F('f_mail','Email',u.email||'','email')}</div>
 <h4>Tizimga kirish</h4><div class=fg>${F('f_login','Login *',u.login||'','text',(id?'readonly ':'')+'oninput="this.dataset.t=1" autocomplete=off')}<label>${id?'Yangi parol (o\'zgartirmasangiz bo\'sh qoldiring)':'Parol * (kamida 8 belgi)'}<input id=f_pass type=text autocomplete=off></label><label>Rol<select id=f_role>${['teacher','director','admin'].map(r=>`<option value=${r} ${(u.role||'teacher')==r?'selected':''}>${ROLE[r]}</option>`).join('')}</select></label></div>
 <div class=row style="margin-top:10px"><button type=button class=b onclick="genP()" style="background:var(--m);box-shadow:none">🔑 Parol yaratish</button>${id?`<label><input type=checkbox id=f_act ${u.is_active?'checked':''}> Faol xodim</label>`:''}</div></div>
 <div class=df><button type=button class=g style="color:var(--m)" onclick="dlg.close()">Bekor qilish</button><button type=button class=b onclick="go(saveT)">Saqlash</button></div>`;dlg.showModal()}

 else{b.login=f_login.value;b.password=f_pass.value;await api('POST','/users',b);dlg.querySelector('.db').innerHTML=`<h3>✅ Xodim yaratildi</h3><div class=cred>Xodim: <b>${e(b.last_name+' '+b.first_name)}</b><br>Login: <b>${e(b.login)}</b><br>Parol: <b>${e(b.password)}</b></div><p class=m>Parol keyin ko'rsatilmaydi. Hozir nusxalab xodimga bering.</p>`;dlg.querySelector('.df').innerHTML=`<button class=b onclick="navigator.clipboard.writeText('Login: ${e(b.login)}\\nParol: ${e(b.password)}');msg('Nusxalandi')">Nusxalash</button><button class=b onclick="dlg.close();V.users()">Yopish</button>`}};
boot();
